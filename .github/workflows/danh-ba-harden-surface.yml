name: Danh ba MTTQ - Harden server surface

on:
  push:
    branches: ["main"]
    paths:
      - ".github/scripts/harden-danh-ba-surface.mjs"
      - ".github/workflows/danh-ba-harden-surface.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: danh-ba-mttq-harden-surface
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Hide internal Apps Script functions
        run: node .github/scripts/harden-danh-ba-surface.mjs
      - name: Validate hardened source
        working-directory: apps/danh-ba-mttq-cao-bang
        run: node scripts/validate.mjs
      - name: Commit hardened source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/danh-ba-mttq-cao-bang
          if git diff --cached --quiet; then
            echo "No hardening changes required."
            exit 0
          fi
          git commit -m "security: hide internal Apps Script server functions"
          git push
