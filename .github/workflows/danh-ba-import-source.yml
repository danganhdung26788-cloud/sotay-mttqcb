name: Danh ba MTTQ - Import Phase 4 source

on:
  push:
    branches: ["main"]
    paths:
      - "bootstrap/danh-ba-mttq-cao-bang/READY"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: danh-ba-mttq-source-import
  cancel-in-progress: false

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild verified source package
        shell: bash
        run: |
          test -f bootstrap/danh-ba-mttq-cao-bang/READY
          test -f bootstrap/danh-ba-mttq-cao-bang/SHA256
          cat bootstrap/danh-ba-mttq-cao-bang/chunks/*.b64 | base64 -d > /tmp/danh-ba-phase4.zip
          echo "$(cat bootstrap/danh-ba-mttq-cao-bang/SHA256)  /tmp/danh-ba-phase4.zip" | sha256sum -c -

      - name: Extract source package
        shell: bash
        run: |
          rm -rf apps/danh-ba-mttq-cao-bang
          mkdir -p apps
          unzip -q -o /tmp/danh-ba-phase4.zip -d apps
          test -f apps/danh-ba-mttq-cao-bang/scripts/validate.mjs
          test -f apps/danh-ba-mttq-cao-bang/src/Code.gs

      - name: Validate extracted source
        working-directory: apps/danh-ba-mttq-cao-bang
        run: node scripts/validate.mjs

      - name: Commit extracted source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/danh-ba-mttq-cao-bang
          if git diff --cached --quiet; then
            echo "Source already up to date."
            exit 0
          fi
          git commit -m "feat: import Danh ba MTTQ Cao Bang Phase 4 source"
          git push
