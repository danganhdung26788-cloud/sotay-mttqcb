name: Danh ba MTTQ - CI

on:
  pull_request:
    branches: ["main"]
    paths:
      - "apps/danh-ba-mttq-cao-bang/**"
      - ".github/workflows/danh-ba-ci.yml"
      - ".github/workflows/danh-ba-deploy.yml"
  push:
    branches: ["main", "develop"]
    paths:
      - "apps/danh-ba-mttq-cao-bang/**"
      - ".github/workflows/danh-ba-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Danh ba source
        id: source
        shell: bash
        run: |
          if [ -f "apps/danh-ba-mttq-cao-bang/scripts/validate.mjs" ] && [ -d "apps/danh-ba-mttq-cao-bang/src" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Danh ba source found."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Danh ba source has not been imported yet; CI bootstrap is healthy."
          fi

      - name: Setup Node.js
        if: steps.source.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate Apps Script source
        if: steps.source.outputs.ready == 'true'
        working-directory: apps/danh-ba-mttq-cao-bang
        run: node scripts/validate.mjs

      - name: Bootstrap status
        if: steps.source.outputs.ready != 'true'
        run: echo "PASS - workflow installed; waiting for Phase 4 source import."
