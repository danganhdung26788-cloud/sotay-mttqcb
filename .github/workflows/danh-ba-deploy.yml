name: Danh ba MTTQ - Runtime Gate + Deploy

on:
  push:
    branches: ["main"]
    paths:
      - "apps/danh-ba-mttq-cao-bang/src/**"
      - "apps/danh-ba-mttq-cao-bang/scripts/**"
      - "apps/danh-ba-mttq-cao-bang/package.json"
      - "apps/danh-ba-mttq-cao-bang/.claspignore"
      - ".github/workflows/danh-ba-deploy.yml"
  workflow_dispatch:
    inputs:
      description:
        description: "Release note"
        required: false
        default: "Manual runtime gate from GitHub"

permissions:
  contents: read

concurrency:
  group: danh-ba-mttq-apps-script-production
  cancel-in-progress: false

jobs:
  runtime-gate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate source
        working-directory: apps/danh-ba-mttq-cao-bang
        run: node scripts/validate.mjs

      - name: Install clasp
        working-directory: apps/danh-ba-mttq-cao-bang
        run: npm install --no-audit --no-fund

      - name: Verify required secrets
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASP_JSON: ${{ secrets.CLASP_JSON }}
        run: |
          test -n "$CLASPRC_JSON" || (echo "Missing CLASPRC_JSON" && exit 1)
          test -n "$CLASP_JSON" || (echo "Missing CLASP_JSON" && exit 1)

      - name: Configure clasp credentials
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASP_JSON: ${{ secrets.CLASP_JSON }}
        run: |
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          printf '%s' "$CLASP_JSON" > apps/danh-ba-mttq-cao-bang/.clasp.json
          chmod 600 ~/.clasprc.json apps/danh-ba-mttq-cao-bang/.clasp.json

      - name: Create one-time runtime gate token
        shell: bash
        run: |
          TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$TOKEN"
          HASH="$(printf '%s' "$TOKEN" | sha256sum | awk '{print $1}')"
          echo "RUNTIME_GATE_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "RUNTIME_GATE_HASH=$HASH" >> "$GITHUB_ENV"

      - name: Enable runtime gate in transient workspace
        working-directory: apps/danh-ba-mttq-cao-bang
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'src/RuntimeGateConfig.gs';
          const src = fs.readFileSync(p,'utf8');
          const hash = process.env.RUNTIME_GATE_HASH;
          if (!/^[a-f0-9]{64}$/.test(hash || '')) throw new Error('Invalid runtime gate hash');
          if (!src.includes('__RUNTIME_GATE_TOKEN_SHA256__')) throw new Error('Runtime gate placeholder missing');
          fs.writeFileSync(p, src.replace('__RUNTIME_GATE_TOKEN_SHA256__', hash));
          NODE

      - name: Push transient runtime-gate source
        working-directory: apps/danh-ba-mttq-cao-bang
        run: npx clasp push -f

      - name: Create temporary runtime-gate deployment
        id: runtime_deploy
        working-directory: apps/danh-ba-mttq-cao-bang
        shell: bash
        run: |
          OUT="$(npx clasp create-deployment --description "DANH_BA_RUNTIME_GATE ${GITHUB_SHA}" --json)"
          printf '%s' "$OUT" > /tmp/runtime-deployment.json
          ID="$(node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/runtime-deployment.json','utf8'));
          const id=x.deploymentId || (x.result && x.result.deploymentId) || (x.deployment && x.deployment.deploymentId);
          if(!id) throw new Error('deploymentId not found');
          process.stdout.write(String(id));
          NODE
          )"
          echo "deployment_id=$ID" >> "$GITHUB_OUTPUT"
          echo "runtime_url=https://script.google.com/macros/s/$ID/exec" >> "$GITHUB_OUTPUT"

      - name: Execute initial baseline and credential gate
        id: gate
        shell: bash
        env:
          RUNTIME_URL: ${{ steps.runtime_deploy.outputs.runtime_url }}
        run: |
          curl -fsSL --retry 8 --retry-all-errors --retry-delay 5             "$RUNTIME_URL?view=__runtime_gate&mode=baseline&token=$RUNTIME_GATE_TOKEN"             -o /tmp/runtime-gate-initial.json

          cat /tmp/runtime-gate-initial.json | jq .

          GATE="$(jq -r '.gate // "BLOCKED"' /tmp/runtime-gate-initial.json)"
          OK="$(jq -r '.ok // false' /tmp/runtime-gate-initial.json)"
          echo "gate=$GATE" >> "$GITHUB_OUTPUT"
          echo "ok=$OK" >> "$GITHUB_OUTPUT"

          {
            echo "## Danh bạ runtime gate"
            echo ""
            echo "- Initial gate: **$GATE**"
            echo "- Database baseline: $(jq -c '.database // {}' /tmp/runtime-gate-initial.json)"
            echo "- Credential state before bootstrap: $(jq -c '.credentials // {}' /tmp/runtime-gate-initial.json)"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$GATE" = "BLOCKED" ] || [ "$OK" != "true" ]; then
            exit 1
          fi

      - name: Provision pending credentials automatically
        if: steps.gate.outputs.gate == 'REVIEW'
        id: provision
        shell: bash
        env:
          RUNTIME_URL: ${{ steps.runtime_deploy.outputs.runtime_url }}
        run: |
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 5             "$RUNTIME_URL?view=__runtime_gate&mode=provision&token=$RUNTIME_GATE_TOKEN"             -o /tmp/credential-provision-result.json

          cat /tmp/credential-provision-result.json | jq .

          OK="$(jq -r '.ok // false' /tmp/credential-provision-result.json)"
          GATE="$(jq -r '.gate // "BLOCKED"' /tmp/credential-provision-result.json)"
          COUNT="$(jq -r '.provision.count // 0' /tmp/credential-provision-result.json)"
          FILE="$(jq -r '.provision.handoff_file_name // ""' /tmp/credential-provision-result.json)"
          echo "ok=$OK" >> "$GITHUB_OUTPUT"
          echo "gate=$GATE" >> "$GITHUB_OUTPUT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "handoff_file_name=$FILE" >> "$GITHUB_OUTPUT"

          {
            echo "- Credential bootstrap: **$GATE**"
            echo "- Accounts provisioned: **$COUNT**"
            if [ -n "$FILE" ]; then
              echo "- Private credential handoff file: $FILE"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$OK" != "true" ] || [ "$GATE" != "PASS" ]; then
            exit 1
          fi

      - name: Re-run baseline after credential bootstrap
        if: steps.gate.outputs.ok == 'true'
        id: final_gate
        shell: bash
        env:
          RUNTIME_URL: ${{ steps.runtime_deploy.outputs.runtime_url }}
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5             "$RUNTIME_URL?view=__runtime_gate&mode=baseline&token=$RUNTIME_GATE_TOKEN"             -o /tmp/runtime-gate-result.json

          cat /tmp/runtime-gate-result.json | jq .

          GATE="$(jq -r '.gate // "BLOCKED"' /tmp/runtime-gate-result.json)"
          OK="$(jq -r '.ok // false' /tmp/runtime-gate-result.json)"
          echo "gate=$GATE" >> "$GITHUB_OUTPUT"
          echo "ok=$OK" >> "$GITHUB_OUTPUT"

          {
            echo "- Final gate: **$GATE**"
            echo "- Credential state after bootstrap: $(jq -c '.credentials // {}' /tmp/runtime-gate-result.json)"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$OK" != "true" ] || [ "$GATE" != "PASS" ]; then
            exit 1
          fi

      - name: Prepare private acceptance clone
        if: steps.final_gate.outputs.gate == 'PASS'
        id: acceptance_prepare
        shell: bash
        env:
          RUNTIME_URL: ${{ steps.runtime_deploy.outputs.runtime_url }}
        run: |
          curl -fsSL --max-time 420 \
            "$RUNTIME_URL?view=__runtime_gate&mode=acceptance_prepare&token=$RUNTIME_GATE_TOKEN" \
            -o /tmp/acceptance-prepare.json
          cat /tmp/acceptance-prepare.json | jq .
          OK="$(jq -r '.ok // false' /tmp/acceptance-prepare.json)"
          GATE="$(jq -r '.gate // "BLOCKED"' /tmp/acceptance-prepare.json)"
          echo "ok=$OK" >> "$GITHUB_OUTPUT"
          echo "gate=$GATE" >> "$GITHUB_OUTPUT"
          echo "- Acceptance prepare: **$GATE**" >> "$GITHUB_STEP_SUMMARY"
          if [ "$OK" != "true" ] || [ "$GATE" != "PASS" ]; then exit 1; fi

      - name: Run clone core acceptance
        if: steps.acceptance_prepare.outputs.gate == 'PASS'
        id: acceptance_core
        shell: bash
        env:
          RUNTIME_URL: ${{ steps.runtime_deploy.outputs.runtime_url }}
        run: |
          curl -fsSL --max-time 420 \
            "$RUNTIME_URL?view=__runtime_gate&mode=acceptance_core&token=$RUNTIME_GATE_TOKEN" \
            -o /tmp/acceptance-core.json
          cat /tmp/acceptance-core.json | jq .
          OK="$(jq -r '.ok // false' /tmp/acceptance-core.json)"
          GATE="$(jq -r '.gate // "BLOCKED"' /tmp/acceptance-core.json)"
          FAILED="$(jq -r '.failed_test // ""' /tmp/acceptance-core.json)"
          echo "ok=$OK" >> "$GITHUB_OUTPUT"
          echo "gate=$GATE" >> "$GITHUB_OUTPUT"
          {
            echo "- Core acceptance: **$GATE**"
            if [ -n "$FAILED" ]; then echo "- Failed test: **$FAILED**"; fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$OK" != "true" ] || [ "$GATE" != "PASS" ]; then exit 1; fi

      - name: Run backup and restore-on-clone acceptance
        if: steps.acceptance_core.outputs.gate == 'PASS'
        id: acceptance_restore
        shell: bash
        env:
          RUNTIME_URL: ${{ steps.runtime_deploy.outputs.runtime_url }}
        run: |
          curl -fsSL --max-time 420 \
            "$RUNTIME_URL?view=__runtime_gate&mode=acceptance_restore&token=$RUNTIME_GATE_TOKEN" \
            -o /tmp/acceptance-restore.json
          cat /tmp/acceptance-restore.json | jq .
          OK="$(jq -r '.ok // false' /tmp/acceptance-restore.json)"
          GATE="$(jq -r '.gate // "BLOCKED"' /tmp/acceptance-restore.json)"
          FAILED="$(jq -r '.failed_test // ""' /tmp/acceptance-restore.json)"
          echo "ok=$OK" >> "$GITHUB_OUTPUT"
          echo "gate=$GATE" >> "$GITHUB_OUTPUT"
          {
            echo "- Backup/restore-on-clone: **$GATE**"
            if [ -n "$FAILED" ]; then echo "- Failed test: **$FAILED**"; fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$OK" != "true" ] || [ "$GATE" != "PASS" ]; then exit 1; fi

      - name: Cleanup acceptance clone
        if: always() && steps.final_gate.outputs.gate == 'PASS'
        id: acceptance_cleanup
        shell: bash
        env:
          RUNTIME_URL: ${{ steps.runtime_deploy.outputs.runtime_url }}
        run: |
          curl -fsSL --max-time 120 \
            "$RUNTIME_URL?view=__runtime_gate&mode=acceptance_cleanup&token=$RUNTIME_GATE_TOKEN" \
            -o /tmp/acceptance-cleanup.json
          cat /tmp/acceptance-cleanup.json | jq .
          OK="$(jq -r '.ok // false' /tmp/acceptance-cleanup.json)"
          GATE="$(jq -r '.gate // "BLOCKED"' /tmp/acceptance-cleanup.json)"
          echo "ok=$OK" >> "$GITHUB_OUTPUT"
          echo "gate=$GATE" >> "$GITHUB_OUTPUT"
          echo "- Acceptance cleanup: **$GATE**" >> "$GITHUB_STEP_SUMMARY"
          if [ "$OK" != "true" ] || [ "$GATE" != "PASS" ]; then exit 1; fi

      - name: Upload runtime gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: danh-ba-runtime-gate-${{ github.run_id }}
          path: |
            /tmp/runtime-gate-initial.json
            /tmp/credential-provision-result.json
            /tmp/runtime-gate-result.json
            /tmp/acceptance-prepare.json
            /tmp/acceptance-core.json
            /tmp/acceptance-restore.json
            /tmp/acceptance-cleanup.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Remove temporary deployment
        if: always() && steps.runtime_deploy.outputs.deployment_id != ''
        working-directory: apps/danh-ba-mttq-cao-bang
        run: npx clasp delete-deployment "${{ steps.runtime_deploy.outputs.deployment_id }}" || true

      - name: Restore clean source on Apps Script HEAD
        if: always()
        working-directory: apps/danh-ba-mttq-cao-bang
        shell: bash
        run: |
          git checkout -- src/RuntimeGateConfig.gs
          npx clasp push -f

      - name: Discover or create production deployment
        if: success() && steps.final_gate.outputs.gate == 'PASS' && steps.acceptance_prepare.outputs.gate == 'PASS' && steps.acceptance_core.outputs.gate == 'PASS' && steps.acceptance_restore.outputs.gate == 'PASS' && steps.acceptance_cleanup.outputs.gate == 'PASS'
        id: production
        working-directory: apps/danh-ba-mttq-cao-bang
        shell: bash
        run: |
          npx clasp list-deployments --json > /tmp/deployments.json
          EXISTING_ID="$(node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/deployments.json','utf8'));
          const list=Array.isArray(x) ? x : (x.deployments || (x.result && x.result.deployments) || []);
          const item=list.find(d => String((d.deploymentConfig && d.deploymentConfig.description) || d.description || '').startsWith('DANH_BA_PRODUCTION'));
          process.stdout.write(item && item.deploymentId ? String(item.deploymentId) : '');
          NODE
          )"

          DESC="DANH_BA_PRODUCTION | GitHub ${GITHUB_SHA}"
          if [ -n "$EXISTING_ID" ]; then
            npx clasp create-deployment --deploymentId "$EXISTING_ID" --description "$DESC" --json > /tmp/production-deployment.json
            ID="$EXISTING_ID"
          else
            npx clasp create-deployment --description "$DESC" --json > /tmp/production-deployment.json
            ID="$(node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/production-deployment.json','utf8'));
          const id=x.deploymentId || (x.result && x.result.deploymentId) || (x.deployment && x.deployment.deploymentId);
          if(!id) throw new Error('production deploymentId not found');
          process.stdout.write(String(id));
          NODE
            )"
          fi

          echo "deployment_id=$ID" >> "$GITHUB_OUTPUT"
          echo "url=https://script.google.com/macros/s/$ID/exec" >> "$GITHUB_OUTPUT"
          {
            echo "- Production deployment: **$ID**"
            echo "- Web App URL: https://script.google.com/macros/s/$ID/exec"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Public Web App smoke test
        if: success() && steps.production.outputs.url != ''
        shell: bash
        env:
          WEBAPP_URL: ${{ steps.production.outputs.url }}
        run: |
          curl -fsSL --retry 8 --retry-all-errors --retry-delay 5 "$WEBAPP_URL" -o /tmp/public.html
          curl -fsSL --retry 8 --retry-all-errors --retry-delay 5 "$WEBAPP_URL?view=admin" -o /tmp/admin.html
          grep -qi "Danh bạ" /tmp/public.html
          grep -qi "Danh bạ" /tmp/admin.html
          echo "- Public/admin HTML smoke: **PASS**" >> "$GITHUB_STEP_SUMMARY"
