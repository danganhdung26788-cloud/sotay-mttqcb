<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d0915">
  <meta name="description" content="Bốc ngẫu nhiên 5 lá từ bộ Tarot huyền bí 78 lá.">
  <title>Bốc 5 lá Tarot</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="hero">
      <div>
        <p class="eyebrow">BỘ TAROT HUYỀN BÍ 78 LÁ</p>
        <h1>Bốc 5 lá Tarot</h1>
        <p class="subtitle">Bốc ngẫu nhiên 5 lá không trùng nhau, hiển thị cùng một trang để chụp ảnh.</p>
      </div>
      <p class="load-status" id="loadStatus">Sẵn sàng</p>
    </header>

    <section class="toolbar" aria-label="Điều khiển">
      <button class="button primary" id="drawButton" type="button">Bốc ngẫu nhiên 5 lá</button>
      <button class="button" id="captureButton" type="button" disabled>Chế độ chụp ảnh</button>
      <button class="button" id="toggleNamesButton" type="button" disabled>Ẩn tên bên dưới</button>
    </section>

    <section class="spread-shell" id="spreadShell">
      <div class="empty-state" id="emptyState">
        <span class="moon">☾</span>
        <h2>Chưa bốc bài</h2>
        <p>Nhấn nút phía trên để bốc 5 lá.</p>
      </div>
      <div class="spread" id="spread" hidden></div>
    </section>

    <section class="question-panel" id="questionPanel" hidden>
      <label for="question">Câu hỏi hoặc thông tin muốn AI giải thích</label>
      <textarea id="question" rows="4" placeholder="Ví dụ: Tôi cần chú ý điều gì trong công việc thời gian tới?"></textarea>
      <div class="question-actions">
        <button class="button" id="copyButton" type="button">Sao chép câu hỏi + 5 lá</button>
        <span id="copyStatus" role="status"></span>
      </div>
    </section>

    <p class="notice">Tarot dùng để gợi mở suy ngẫm, không phải dự đoán chắc chắn.</p>
  </main>

  <button class="exit-capture" id="exitCaptureButton" type="button">Thoát chế độ chụp</button>

  <script src="cards.js"></script>
  <script src="app.js"></script>
</body>
</html>
