name: Deploy Apps Script
on:
  workflow_dispatch:
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate source
        run: node scripts/validate.mjs
      - name: Install clasp
        run: npm install --no-audit --no-fund
      - name: Configure clasp
        shell: bash
        run: |
          test -n "${{ secrets.CLASPRC_JSON }}" || (echo "Missing CLASPRC_JSON" && exit 1)
          test -n "${{ secrets.CLASP_JSON }}" || (echo "Missing CLASP_JSON" && exit 1)
          printf '%s' '${{ secrets.CLASPRC_JSON }}' > ~/.clasprc.json
          printf '%s' '${{ secrets.CLASP_JSON }}' > .clasp.json
          chmod 600 ~/.clasprc.json .clasp.json
      - name: Push source
        run: npx clasp push -f
      - name: Update existing Web App deployment
        if: ${{ secrets.CLASP_DEPLOYMENT_ID != '' }}
        run: npx clasp create-deployment --deploymentId "${{ secrets.CLASP_DEPLOYMENT_ID }}" --description "GitHub ${GITHUB_SHA}"
      - name: Initial deployment reminder
        if: ${{ secrets.CLASP_DEPLOYMENT_ID == '' }}
        run: |
          echo "Source pushed successfully."
          echo "Create the first Web App deployment in Apps Script UI, then save its deployment ID as CLASP_DEPLOYMENT_ID."
