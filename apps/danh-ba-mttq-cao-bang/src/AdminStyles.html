<style>
:root{--red:#b71c1c;--red2:#d32f2f;--bg:#f5f6f8;--ink:#202124;--muted:#6b7280;--line:#e3e5e8;--white:#fff;--radius:14px}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:var(--bg)}button,input,select{font:inherit}.hidden{display:none!important}
button{cursor:pointer;border:1px solid #d6d9dd;background:#fff;border-radius:9px;padding:8px 12px}.primary{background:var(--red);color:#fff;border-color:var(--red)}.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
.login-page{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#850e0e,#d13a3a)}.login-card,.dialog{width:min(440px,100%);background:#fff;border-radius:18px;padding:26px;box-shadow:0 20px 60px rgba(0,0,0,.2)}.brand-badge{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:var(--red);color:#fff;font-weight:800}.login-card h1{margin-bottom:4px}.login-card p{color:var(--muted);margin-top:0}.login-card label,.dialog label{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}.login-card input,.dialog input,.dialog select,.toolbar input,.toolbar select,.panel input,.panel select,.bulkbar select{width:100%;height:42px;border:1px solid #d7dadd;border-radius:9px;padding:0 10px;background:#fff}.login-card .primary{width:100%;margin-top:18px}.error-text{color:#b00020;font-size:13px;margin-top:10px;min-height:18px}
.admin-shell{min-height:100vh;display:grid;grid-template:64px 1fr/220px minmax(0,1fr);grid-template-areas:"top top" "nav main"}.admin-topbar{grid-area:top;background:linear-gradient(110deg,#951414,var(--red2));color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 20px}.admin-topbar div:first-child{display:flex;gap:10px;align-items:baseline}.admin-topbar span{font-size:12px;opacity:.9}.user-box{display:flex;align-items:center;gap:10px}.ghost-link{color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.35);border-radius:9px;padding:8px 10px;font-size:12px}.ghost-link:hover{background:rgba(255,255,255,.1)}
.admin-nav{grid-area:nav;background:#fff;border-right:1px solid var(--line);padding:14px}.admin-nav button{width:100%;border:0;text-align:left;margin-bottom:5px}.admin-nav button.active{background:#fff0f0;color:#951414;font-weight:700}.group-toolbar{grid-template-columns:1.5fr 1.2fr 1.2fr 150px auto}.admin-main{grid-area:main;padding:22px;min-width:0}.tab-pane{max-width:1500px;margin:0 auto}.pane-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.toolbar{display:grid;grid-template-columns:2fr 1fr 180px auto;gap:8px;margin:14px 0}.bulkbar{display:flex;align-items:center;gap:8px;padding:10px;background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:10px}.bulkbar select{max-width:300px}
.table-wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px}.table-wrap.small{max-height:350px;margin-top:12px}table{width:100%;border-collapse:collapse;min-width:800px}th,td{padding:10px;border-bottom:1px solid #eef0f2;text-align:left;font-size:13px;vertical-align:middle}th{background:#fafafa;position:sticky;top:0;z-index:1}.badge{display:inline-block;padding:4px 7px;border-radius:999px;font-size:11px;background:#eee}.badge.pass{background:#e8f5e9;color:#1b5e20}.badge.review{background:#fff4d6;color:#8a5b00}.badge.active{background:#e8f5e9;color:#1b5e20}.badge.locked{background:#fdebec;color:#8e1b22}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.stat-card,.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px}.stat-card strong{display:block;font-size:28px;color:var(--red)}.muted{color:var(--muted);font-size:13px}.two-col{display:grid;grid-template-columns:2fr 1fr;gap:14px}
.modal-layer{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:grid;place-items:center;padding:18px}.dialog.wide{width:min(760px,100%);max-height:90vh;overflow:auto}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.toast{position:fixed;right:18px;bottom:18px;background:#222;color:#fff;padding:12px 16px;border-radius:10px;z-index:120}
.level3-item{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;margin:8px 0;display:flex;align-items:center;justify-content:space-between;gap:10px}
@media(max-width:900px){.group-toolbar{grid-template-columns:1fr}.admin-shell{display:block}.admin-topbar{height:64px;position:sticky;top:0;z-index:20}.admin-nav{display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px}.admin-nav button{min-width:max-content;width:auto;margin:0 4px}.admin-main{padding:14px}.cards{grid-template-columns:1fr 1fr}.toolbar{grid-template-columns:1fr}.two-col{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}}
.avatar-admin{width:52px;height:52px;border-radius:50%;object-fit:cover;background:#f1f2f4}
.avatar-upload-row{display:flex;gap:12px;align-items:center;margin:12px 0}
.review-actions{display:flex;gap:6px}
.danger{background:#fff;border:1px solid #b71c1c;color:#b71c1c}
.warning-box{padding:10px;border:1px solid #f0c36d;background:#fff8e6;border-radius:10px;margin:10px 0}
</style>
