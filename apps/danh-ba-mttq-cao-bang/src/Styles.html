<style>
:root{--red:#b71c1c;--red2:#d32f2f;--soft:#fff1f1;--ink:#202124;--muted:#6b7280;--line:#e5e7eb;--page:#f6f7f9;--shadow:0 10px 30px rgba(24,28,33,.08);--radius:16px}
*{box-sizing:border-box} html,body{margin:0;min-height:100%;background:var(--page);color:var(--ink);font-family:Arial,Helvetica,sans-serif} button,input{font:inherit} button{cursor:pointer}.hidden{display:none!important}.mobile-only{display:none}
.app-shell{min-height:100vh;display:flex;flex-direction:column}
.topbar{min-height:78px;padding:12px 24px;display:flex;align-items:center;gap:14px;color:#fff;background:linear-gradient(120deg,#9e1515,var(--red2));box-shadow:0 4px 18px rgba(120,0,0,.22);position:sticky;top:0;z-index:30}
.brand-mark{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:#fff;color:var(--red);border:3px solid rgba(255,255,255,.55)}
.brand-copy .eyebrow{font-size:12px;opacity:.9;letter-spacing:.05em}.brand-copy h1{margin:3px 0 0;font-size:24px}.topbar-meta{margin-left:auto;display:flex;gap:10px;font-size:13px}
.search-band{padding:18px 24px;display:flex;align-items:center;gap:20px;background:#fff;border-bottom:1px solid var(--line)}.search-wrap{flex:1;max-width:880px;position:relative}
.search-wrap input{width:100%;height:48px;border:1px solid #d7dbe0;border-radius:14px;padding:0 76px 0 46px;outline:none;background:#fafafa}.search-wrap input:focus{background:#fff;border-color:var(--red2);box-shadow:0 0 0 3px rgba(211,47,47,.10)}
.search-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:22px}.clear-btn{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--red);font-weight:700}
.quick-stats{margin-left:auto;display:flex;gap:8px}.quick-stats span{padding:8px 11px;border-radius:999px;background:var(--soft);color:#8f1c1c;font-size:13px;font-weight:700}
.main-layout{width:100%;max-width:1600px;margin:0 auto;flex:1;display:grid;grid-template-columns:320px minmax(0,1fr)}
.sidebar{background:#fff;border-right:1px solid var(--line);min-height:calc(100vh - 160px);padding:18px 14px}.sidebar-head{display:flex;align-items:center;justify-content:space-between;padding:2px 8px 14px;border-bottom:1px solid var(--line)}
.section-label{color:var(--red);font-size:11px;font-weight:800;letter-spacing:.08em}.org-tree{padding-top:10px}.tree-node{margin:2px 0}
.tree-row{width:100%;display:grid;grid-template-columns:28px minmax(0,1fr) auto;align-items:center;min-height:42px;border:0;border-radius:10px;background:transparent;text-align:left;padding:5px 8px;color:var(--ink)}.tree-row:hover{background:#f7f7f8}.tree-row.active{background:var(--soft);color:#8f1c1c;font-weight:700}
.tree-toggle{width:26px;height:26px;border:0;background:transparent;color:var(--muted)}.tree-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tree-count{color:var(--muted);font-size:11px;background:#f0f1f3;padding:3px 6px;border-radius:999px}.tree-children{margin-left:20px;padding-left:8px;border-left:1px dashed #ddd}
.content-panel{padding:24px;min-width:0}.content-head{display:flex;justify-content:space-between;gap:20px}.content-head h2{margin:4px 0;font-size:26px}.breadcrumb{color:var(--red);font-size:12px;font-weight:700}.muted{margin:0;color:var(--muted)}
.primary-btn,.secondary-btn{border-radius:10px;min-height:40px;padding:0 14px;font-weight:700}.primary-btn{border:1px solid var(--red);background:var(--red);color:#fff}.secondary-btn{border:1px solid #d4d7dc;background:#fff}
.group-chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.chip{border:1px solid #dedfe2;background:#fff;color:#4b5563;border-radius:999px;padding:7px 11px;font-size:12px}.chip.active{border-color:#efb3b3;background:var(--soft);color:#961919;font-weight:700}
.result-summary{min-height:22px;margin:4px 0 14px;color:var(--muted);font-size:13px}.contact-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.contact-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:grid;grid-template-columns:58px minmax(0,1fr);gap:13px;transition:.18s}.contact-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.avatar{width:58px;height:58px;border-radius:50%;object-fit:cover;background:linear-gradient(135deg,#fbd7d7,#fff0d0);color:var(--red);display:grid;place-items:center;font-weight:800;font-size:18px}
.contact-name{font-weight:800;font-size:16px}.contact-position{color:#4b5563;font-size:13px}.contact-org{color:var(--muted);font-size:12px;margin-top:5px;line-height:1.35}.contact-phone{margin-top:10px;font-weight:800;color:#8f1c1c}
.card-actions{grid-column:1/-1;display:flex;gap:7px;padding-top:11px;border-top:1px solid #f0f0f0}.action-link{flex:1;min-height:36px;border:1px solid #e0e2e5;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;color:#374151;text-decoration:none;font-size:12px;font-weight:700}.action-link.disabled{opacity:.4;pointer-events:none}
.state-card{min-height:240px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;color:var(--muted);background:#fff;border:1px dashed #d8dadd;border-radius:var(--radius);padding:28px}.spinner{width:34px;height:34px;border-radius:50%;border:3px solid #eee;border-top-color:var(--red);animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.footer{display:flex;justify-content:space-between;padding:14px 24px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);background:#fff}.icon-btn{width:40px;height:40px;border:0;border-radius:10px;background:rgba(255,255,255,.14);color:inherit}.sidebar-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:39}
@media(max-width:1180px){.main-layout{grid-template-columns:285px minmax(0,1fr)}.contact-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:820px){.mobile-only{display:inline-grid;place-items:center}.desktop-only{display:none!important}.topbar{padding:10px 14px;min-height:70px}.brand-mark{width:42px;height:42px}.brand-copy .eyebrow{font-size:10px}.brand-copy h1{font-size:18px}.search-band{padding:12px 14px;display:block}.quick-stats{margin-top:9px}.main-layout{display:block}.sidebar{position:fixed;z-index:40;left:0;top:0;bottom:0;width:min(88vw,340px);min-height:100vh;transform:translateX(-103%);transition:.2s;box-shadow:var(--shadow);overflow-y:auto}.sidebar.open{transform:translateX(0)}.content-panel{padding:16px 14px}.content-head{display:block}.contact-grid{grid-template-columns:1fr}.footer{display:block;padding:12px 14px}}
.avatar-box{width:58px;height:58px;position:relative}.avatar-box .avatar{position:absolute;inset:0}
</style>
