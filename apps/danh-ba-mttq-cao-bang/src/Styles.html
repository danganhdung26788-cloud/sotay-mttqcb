<style>
:root{
  --brand:#b71c1c;--brand-strong:#991b1b;--brand-soft:#fff5f4;--brand-line:#f3d7d4;
  --ink:#17191d;--ink-soft:#3f4652;--muted:#737b88;--line:#e7e9ed;--line-strong:#d9dde3;
  --page:#f6f7f9;--surface:#fff;--surface-soft:#fafbfc;--hover:#f3f5f7;
  --shadow:0 12px 32px rgba(20,24,31,.08);--radius:14px
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--page);color:var(--ink);font-family:Inter,Arial,Helvetica,sans-serif}
button,input{font:inherit}button{cursor:pointer}.hidden{display:none!important}.mobile-only{display:none}
.app-shell{min-height:100vh;display:flex;flex-direction:column}

.search-band{padding:14px 20px;display:flex;align-items:center;gap:10px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:68px;z-index:25}
.search-wrap{flex:1;max-width:980px;position:relative;margin:0 auto}
.search-wrap input{width:100%;height:50px;border:1px solid var(--line-strong);border-radius:13px;padding:0 72px 0 45px;outline:none;background:var(--surface-soft);font-size:15px;transition:.16s}
.search-wrap input:hover{border-color:#c8cdd4}.search-wrap input:focus{background:#fff;border-color:#cf7777;box-shadow:0 0 0 3px rgba(183,28,28,.08)}
.search-icon{position:absolute;left:15px;top:50%;transform:translateY(-51%);color:var(--muted);font-size:21px}.clear-btn{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--brand);font-size:12px;font-weight:750;padding:7px}
.filter-btn{height:42px;border:1px solid var(--line-strong);border-radius:11px;background:#fff;color:var(--ink-soft);padding:0 12px;display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;white-space:nowrap}.filter-btn:hover{background:var(--hover)}
.filter-count{min-width:20px;height:20px;border-radius:999px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);font-size:11px}
.quick-stats{margin-left:auto;display:flex;gap:7px}.quick-stats span,.mobile-stats span{padding:7px 10px;border-radius:999px;background:#f5f6f8;color:#555e6b;font-size:12px;font-weight:700;border:1px solid #eceef1}
.main-layout{width:100%;max-width:1760px;margin:0 auto;flex:1;display:grid;grid-template-columns:286px minmax(0,1fr);transition:grid-template-columns .2s ease}
.app-shell.sidebar-collapsed .main-layout{grid-template-columns:72px minmax(0,1fr)}
.sidebar{background:var(--surface);border-right:1px solid var(--line);min-height:calc(100vh - 132px);padding:14px 10px;overflow:hidden}
.sidebar-head{height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 8px 12px;border-bottom:1px solid var(--line);gap:8px}

.tree-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}.tree-count{color:#7d8490;font-size:10px;background:#f0f2f4;padding:2px 6px;border-radius:999px}.tree-children{margin-left:17px;padding-left:5px;border-left:1px solid #e5e7eb}
.app-shell.sidebar-collapsed .sidebar{padding-left:8px;padding-right:8px}.app-shell.sidebar-collapsed .sidebar-head>div:first-child,.app-shell.sidebar-collapsed .tree-name,.app-shell.sidebar-collapsed .tree-count,.app-shell.sidebar-collapsed .tree-toggle,.app-shell.sidebar-collapsed .tree-children{display:none}
.app-shell.sidebar-collapsed .sidebar-head{justify-content:center}.app-shell.sidebar-collapsed .sidebar-collapse-btn{transform:rotate(180deg)}
.app-shell.sidebar-collapsed .tree-row{grid-template-columns:1fr;padding:4px;justify-items:center}.app-shell.sidebar-collapsed .tree-icon{width:38px;height:34px;border-radius:9px;background:#f6f7f8;font-size:12px}.app-shell.sidebar-collapsed .tree-row.active .tree-icon{background:var(--brand-soft)}
.content-panel{padding:18px 22px 26px;min-width:0}.content-toolbar{min-height:36px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:4px}
.back-link{border:0;background:transparent;color:#626b77;padding:6px 0;display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700}.back-link:hover{color:var(--brand)}
.view-switch{display:flex;align-items:center;padding:3px;background:#eef0f3;border-radius:10px}.view-btn{border:0;background:transparent;color:#68717d;border-radius:8px;min-height:31px;padding:0 9px;font-size:11px;font-weight:750}.view-btn.active{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(20,24,31,.08)}
.content-head{display:flex;justify-content:space-between;gap:16px;padding:2px 0 4px}.content-head h2{margin:3px 0 2px;font-size:25px;line-height:1.16;letter-spacing:-.015em}.breadcrumb{color:var(--brand);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.045em}.current-meta{font-size:12px;color:#555e6b;font-weight:700;margin-top:5px}.muted{margin:3px 0 0;color:var(--muted);font-size:12px}
.filter-panel{display:flex;align-items:flex-start;gap:7px;margin:10px 0 6px}.group-chips{display:flex;gap:6px;flex-wrap:wrap;min-width:0}.chip{border:1px solid #dfe2e6;background:#fff;color:#59616d;border-radius:999px;padding:6px 10px;font-size:10px;line-height:1.2;white-space:nowrap}.chip:hover{background:#f7f8f9}.chip.active{border-color:#efc1bd;background:var(--brand-soft);color:var(--brand-strong);font-weight:800}
.chip.chip-overflow{display:none}.filter-panel.expanded .chip.chip-overflow{display:inline-flex}.group-more-btn{border:0;background:transparent;color:var(--brand);padding:6px 3px;font-size:10px;font-weight:800;white-space:nowrap}
.results-bar{min-height:30px;display:flex;align-items:center;justify-content:space-between;gap:10px}.result-summary{color:var(--muted);font-size:11px}
.contact-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}
.contact-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:13px;display:grid;grid-template-columns:48px minmax(0,1fr);gap:10px;min-height:132px;transition:transform .16s,border-color .16s,box-shadow .16s}
.contact-card:hover{transform:translateY(-1px);border-color:#d5d9df;box-shadow:0 7px 20px rgba(20,24,31,.06)}
.avatar,.avatar-box{width:48px;height:48px;border-radius:50%}.avatar{object-fit:cover;background:#f8e5e1;color:var(--brand);display:grid;place-items:center;font-weight:850;font-size:14px}.avatar-box{position:relative}.avatar-box .avatar{position:absolute;inset:0}
.contact-main{min-width:0}.contact-name{font-weight:820;font-size:14px;line-height:1.2}.contact-position{color:#505966;font-size:11px;margin-top:2px;line-height:1.25;min-height:14px}.contact-org{color:var(--muted);font-size:10px;margin-top:5px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.contact-phone{margin-top:6px;font-weight:800;color:#303844;font-size:13px;letter-spacing:.01em}

.action-text{display:none}
.contact-grid.list-view{display:flex;flex-direction:column;gap:6px}.contact-grid.list-view .contact-card{min-height:68px;border-radius:11px;padding:9px 11px;display:grid;grid-template-columns:40px minmax(180px,1.3fr) minmax(120px,.8fr) minmax(150px,1fr) 130px;align-items:center;gap:10px}.contact-grid.list-view .avatar,.contact-grid.list-view .avatar-box{width:40px;height:40px}.contact-grid.list-view .contact-main{display:contents}.contact-grid.list-view .contact-name{font-size:13px}.contact-grid.list-view .contact-position{font-size:11px;margin:0;min-height:auto}.contact-grid.list-view .contact-org{font-size:10px;margin:0}.contact-grid.list-view .contact-phone{font-size:12px;margin:0;color:#303844}.contact-grid.list-view .card-actions{grid-column:auto;border:0;padding:0;justify-content:flex-end}.contact-grid.list-view .action-link{width:30px;height:30px}
.state-card{min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:7px;color:var(--muted);background:#fff;border:1px dashed #d8dadd;border-radius:var(--radius);padding:26px}.state-card strong{color:var(--ink)}.spinner{width:32px;height:32px;border-radius:50%;border:3px solid #eee;border-top-color:var(--brand);animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.primary-btn{border-radius:10px;min-height:38px;padding:0 13px;font-weight:750;border:1px solid var(--brand);background:var(--brand);color:#fff}.footer{display:flex;justify-content:space-between;padding:12px 20px;font-size:10px;color:var(--muted);border-top:1px solid var(--line);background:#fff}.icon-btn{width:38px;height:38px;border:0;border-radius:10px;background:rgba(255,255,255,.14);color:inherit}.sidebar-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.34);z-index:39}
@media(max-width:1450px){.contact-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:1180px){.main-layout{grid-template-columns:260px minmax(0,1fr)}.contact-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.contact-grid.list-view .contact-card{grid-template-columns:40px minmax(160px,1.2fr) minmax(100px,.8fr) minmax(120px,1fr) 120px}}
@media(max-width:820px){

  .search-band{top:62px;padding:9px 12px;gap:7px}.search-wrap input{height:46px;padding-left:41px;font-size:14px}.filter-btn{height:40px;padding:0 10px}.filter-btn span:nth-child(2){display:none}
  .main-layout,.app-shell.sidebar-collapsed .main-layout{display:block}.sidebar{position:fixed;z-index:40;left:0;top:0;bottom:0;width:min(88vw,330px);min-height:100vh;transform:translateX(-103%);transition:.2s;box-shadow:var(--shadow);overflow-y:auto}.sidebar.open{transform:translateX(0)}
  .content-panel{padding:13px 12px 20px}.content-toolbar{margin-bottom:5px}.content-head h2{font-size:21px}.current-meta{font-size:11px}.muted{font-size:11px}
  .filter-panel{margin-top:8px;overflow:hidden}.group-chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.group-chips::-webkit-scrollbar{display:none}.chip.chip-overflow{display:inline-flex}.group-more-btn{display:none!important}
  .mobile-stats{display:flex;gap:5px}.contact-grid{grid-template-columns:1fr}.contact-card{min-height:125px}.contact-grid.list-view .contact-card{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:8px}.contact-grid.list-view .contact-main{display:block}.contact-grid.list-view .contact-position,.contact-grid.list-view .contact-org{display:block;margin-top:2px}.contact-grid.list-view .contact-phone{grid-column:2;margin-top:3px}.contact-grid.list-view .card-actions{grid-column:3;grid-row:1/3;flex-direction:column}
  .footer{display:block;padding:10px 12px}
}
@media(max-width:430px){.brand-copy .eyebrow{display:none}.brand-copy h1{font-size:15px}.content-toolbar{align-items:flex-start}.view-btn{padding:0 7px}.contact-card{padding:11px}.search-band{position:sticky}}
</style>
